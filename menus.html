    <style>
        :root {
            --bg-color:#c0ddbf; 
            --border-width: 4px; 
            --main-font: "area-normal", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            font-family: var(--main-font);
            font-weight: 400;
            color: #000;
            margin: 0;
            padding: 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1, h2, .bold {
            letter-spacing: 1px;
            line-height: 1.15;
        }

        .logo-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-logo {
            width: 100%;
            object-fit: contain; 
            box-sizing: border-box;
        }

        .intro-text {
            max-width: 700px;
            text-align: center;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 60px;
            padding: 0 20px;
        }

        section {
            width: 100%;
            max-width: 900px;
            margin-bottom: 50px;
        }

        h1 {
            font-weight: 900;
            font-size: 2rem;
            margin-bottom: 1rem;
            display: inline-block;
        }
       
        
        h2 {
            font-weight: 600;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            display: inline-block;
        }

        p {
            margin-top: 0;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .lead {
            font-size: 1.2rem;
        }

        .bold {
            font-weight: 800;
        }
        
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
        }

        /* Enlaces dentro del grid ocupan el 100% de la altura de la celda */
        .button-grid a {
            display: flex;
            width: 100%;
            height: 100%;
            text-decoration: none; 
            color: inherit;
        }

        .btn-rect {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            background: #82be80;
            border: var(--border-width) solid #000;
            font-family: var(--main-font);
            font-weight: 800;
            font-size: 0.9rem; 
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 15px 10px; 
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px; 
        }

        @media (min-width: 600px) {
            .button-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 25px;
            }
            
            .btn-rect {
                font-size: 1.1rem;
                padding: 25px 40px;
            }
        }

        .btn-rect img {
            display: block;          
            margin: 0 auto 15px;    
            width: 100%;           
            object-fit: cover;      
        }

        .btn-rect:hover {
            background-color: #82be80;
            color: #000;
            transform: translate(-5px, -5px);
            box-shadow: 8px 8px 0px 0px rgba(0,0,0,0.2);
        }

        .btn-rect:active {
            transform: translate(0, 0);
            box-shadow: none;
        }

        /* --- Estilos para la sección de Restaurantes y Filtros --- */
        
        .filter-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            margin-top: 2rem;
            width: 100%;
        }

        @media (min-width: 600px) {
            .filter-container {
                flex-direction: row;
            }
        }

        .filter-input {
            flex: 1;
            padding: 12px 15px;
            font-family: var(--main-font);
            font-weight: 600;
            font-size: 0.95rem;
            border: var(--border-width) solid #000;
            background-color: #fff;
            box-sizing: border-box;
            outline: none;
        }

        .filter-input:focus {
            background-color: #f0fdf4;
            border-color: #000;
        }

        .restaurant-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 600px) {
            .restaurant-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 20px;
            }
        }

        .btn-rect-small {
            min-height: 85px;
            padding: 12px 15px;
            font-size: 0.85rem;
        }

        .restaurant-name {
            font-weight: 800;
            font-size: 1.15rem;
            text-transform: uppercase;
            margin-bottom: 4px;
            line-height: 1.25;
        }

        /* Estilo simplificado sin fondo ni borde */
        .restaurant-concello {
            font-weight: 600;
            font-size: 0.82rem;
            text-transform: none;
            margin-top: 2px;
            opacity: 0.85;
        }

        .no-results {
            display: none;
            text-align: center;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 30px;
            width: 100%;
            grid-column: 1 / -1;
        }

        .logos {
            margin-top: 1rem;
            max-width: 600px;
            padding-bottom: 1rem;
        }
    </style>
</head>

    <!-- Script para filtrado dinámico -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-name');
            const concelloSelect = document.getElementById('search-concello');
            const cards = document.querySelectorAll('.restaurant-card');
            const noResults = document.getElementById('no-results');

            function normalizeText(str) {
                return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
            }

            function filterRestaurants() {
                const nameQuery = normalizeText(searchInput.value);
                const selectedConcello = concelloSelect.value;
                let visibleCount = 0;

                cards.forEach(card => {
                    const name = normalizeText(card.getAttribute('data-name'));
                    const concello = card.getAttribute('data-concello');

                    const matchesName = name.includes(nameQuery);
                    const matchesConcello = selectedConcello === '' || concello === selectedConcello;

                    if (matchesName && matchesConcello) {
                        card.style.display = 'flex';
                        visibleCount++;
                    } else {
                        card.style.display = 'none';
                    }
                });

                if (visibleCount === 0) {
                    noResults.style.display = 'block';
                } else {
                    noResults.style.display = 'none';
                }
            }

            searchInput.addEventListener('input', filterRestaurants);
            concelloSelect.addEventListener('change', filterRestaurants);
        });
    </script>
